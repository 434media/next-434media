# Verifies the Work page still renders every published Section 4 record.
#
# Runs entirely on files in this repository — no secrets, no network, no access
# to the context store. That is the point: the context document cannot live in
# a public repo. The page is generated from it (lib/work-records.ts, written by
# docs/context/"04 Build"/master_extract.py in the context repo), so what CI can
# usefully check is not whether the
# records are correct — the generator settles that — but whether the page still
# shows all of them.
#
# scripts/check_drift.py deliberately does NOT run here. It compares the
# manifest against the master, and docs/context is a symlink to the shared
# drive that no clone has, so it exits zero without reaching the master. In CI
# it would be a check that always passes. It is a local tool.
name: Verify portfolio records

# Deliberately NOT path-filtered. This is a required status check, and a
# path-filtered workflow simply does not run on a PR that misses its paths — so
# GitHub never receives a result and the check hangs on "Expected" forever,
# blocking the merge. The job reads two files and needs no install beyond tsx,
# so running it on every PR costs seconds and always reports.
on:
  pull_request:
  push:
    branches: [main]

# The job only reads two files out of the checkout. Without an explicit block
# the GITHUB_TOKEN carries the repository default, which is wider than this
# needs — and a workflow that runs on every pull_request is exactly where a
# broad default token matters.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The verifier reads two files and uses no runtime dependencies beyond
      # tsx, so a full install is unnecessary.
      - run: pnpm add -g tsx
      - run: tsx scripts/verify-work-page.ts

      # This repository is public, so people's email addresses, phone numbers and movements stay out of it: they
      # live in Firestore behind a server-side gate (event_role_overlays, travel_projects). Fails on any address or
      # phone number in a tracked file that is not on the small allowlist in scripts/personal-data/allowlist.json,
      # and on the two paths that used to hold such data. Node built-ins and git only.
      - run: tsx scripts/personal-data/check.ts

      # The system-of-record JSON Schemas are canonical in the private context
      # repository and are deliberately not copied here: they carry no figures,
      # but they describe the shape of qualification and rate-card data, and this
      # repository is public. So CI cannot regenerate the types to compare them.
      #
      # What it can do without the schemas is confirm the committed generated file
      # still matches the hash recorded beside it — which catches the failure this
      # repo is actually exposed to, someone editing a generated file by hand.
      # "Are the types current with the schemas" is checked where the schemas are.
      - run: tsx scripts/sor/verify-types.ts

      # The visual system's source — logo artwork, the spec, the palette with
      # its provenance — is canonical in the private context repository, so CI
      # cannot regenerate the tokens to compare. It checks the question it can
      # answer: was a generated file edited by hand? A brand colour added here
      # rather than in the handoff is a colour with no provenance.
      - run: tsx scripts/visual/verify-tokens.ts

      # proxy.ts sets the Meta Pixel cookie, so it must run on every public page
      # and skip assets, API routes and the app-root files (2b fix 9). The test
      # uses Next's own matcher, so this step needs the installed dependencies.
      - run: pnpm install --frozen-lockfile
      - run: node --test lib/__tests__/proxy-matcher.test.mjs

      # The outreach sequence sends each step at most once, however runs overlap
      # (2b fix 11). In-memory store with Firestore-style transaction retries.
      - run: tsx --test lib/__tests__/outreach-claim.test.ts

      # Lead with Ops feedback: a call request emails Carroll once (cc the founder, Reply-To the submitter),
      # the other answers send nothing, and a failed send still returns 200. BotID, Firestore and Resend faked.
      - run: tsx --test lib/__tests__/lead-with-ops-feedback.test.ts

      # Prospecting on icp_cohorts (next-434media#63): icp.md stays gone and
      # icp-base.md keeps its shape, a revenue filter appears only when the
      # prompt states a figure, the floor stays out of the prompt, and the
      # cohort matcher behaves. Invented cohort rows; the real ones are internal.
      - run: tsx --test lib/__tests__/icp-cohorts.test.ts

      # Owned Meta: offline state machine and fake-transport regression tests.
      - run: tsx --test lib/__tests__/owned-meta-publisher.test.ts
      # Owned Meta tool route, Slack approval binding and processing continuation (all transports faked).
      - run: tsx --test lib/__tests__/owned-meta-tool.test.ts
      # Owned Meta service entry for the shared Slack app: pilot identity and acting-person checks.
      - run: tsx --test lib/__tests__/owned-meta-service.test.ts
      # Canva brand-template fill for the Slack app, including the photo crop (sharp runs for real here).
      - run: tsx --test lib/__tests__/canva-create.test.ts
      # Brand profiles live in Firestore, not in this public repository (plan v11 Step 1): the generated copies
      # under lib/brand-profiles/ must not come back.
      - run: test ! -e lib/brand-profiles
      # Licensed fonts never go in this public repository; only the allowlisted files may be committed.
      - run: node scripts/fonts/verify-font-files.mjs
      # The email-signature logo is referenced by every signature already sent, so it never moves, changes or goes
      # away (public/email/README.md).
      - run: echo "253dd42c44cec18f23a461fc3a9e0358320a05413506d457420bf05e1da990a8  public/email/434-email-signature-330x132.png" | sha256sum -c -

      # The content-pipeline and brand-profile tests run on the committed fixture profile
      # (lib/__tests__/fixtures/brand-profile.fixture.json): an invented brand with made-up text and template ids, since
      # real profiles are not in this public repository. They always run here, with no secret.
      # Content pipeline in the Admin (moved from the pilot's Slack MCU skill): research → copy → photo → Canva →
      # artwork check → a Review post on the board, the lease rules and the zero-retention model routing. All faked.
      - run: tsx --test lib/__tests__/content-pipeline.test.ts
      # Brand profiles: the profile validates and a failing one is refused; Publish refuses an invalid draft or an
      # unchanged one, Restore republishes without losing draft edits, the engine reads the profile in scope, and posts
      # are stamped.
      - run: tsx --test lib/__tests__/brand-profile.test.ts lib/__tests__/brand-profile-store.test.ts
      # The Create table (plan v11 Step 2): templates from the profile, Human+ on the writer, media, Run job.
      - run: tsx --test lib/__tests__/create-table.test.ts lib/__tests__/brands.test.ts
      # Share with vendor (plan v11.2.1 Step 4 items 4–5): the token is stored as a hash only, jurisdiction and
      # suppression refuse before anything is stored, the daily cap and repeats, a failed mail never opens.
      - run: tsx --test lib/__tests__/brand-share.test.ts
      # The vendor's downloads (Step 4 item 6): what a shared book offers, and a zip of exactly the ticked files.
      - run: tsx --test lib/__tests__/brand-assets.test.ts
      # The approval drawer (plan v11.1 Step 3): a row's variations approved together, bound to the files shown.
      - run: tsx --test lib/__tests__/row-approval.test.ts
      # Event roles and travel routes from Firestore, the create-or-skip import, and the personal-data check itself.
      - run: tsx --test lib/__tests__/personal-data.test.ts
      # The founder-only guard (V1 item 1, finance Phase 0): deny by default, one configured identity, a verified email.
      - run: tsx --test lib/__tests__/founder-guard.test.ts
      # Every finance API handler calls requireFounder first: the proxy guards the page only.
      - run: tsx --test lib/__tests__/finance-routes-guarded.test.ts
      # Admin email sign-in (security log ADM-1): verified email required; workspace addresses use Google in production.
      - run: tsx --test lib/__tests__/firebase-signin.test.ts
      # Owners come only from ADMIN_OWNER_EMAILS: no address in code, and none is a super admin by default.
      - run: tsx --test lib/__tests__/admin-owners.test.ts
      # Every admin sign-in, Google included, needs one active roster record with a valid role (security log ADM-2):
      # no record, a deactivation, no role or a failed lookup is refused, never defaulted to full_admin.
      - run: tsx --test lib/__tests__/admin-signin-roster.test.ts
      # Small admin findings (security log ADM-7 to ADM-11, ADM-13): published-only public blog reads, isActive on
      # super-admin and content checks, verified Google workspace accounts, header-only constant-time cron secrets,
      # workspace-domain member addresses on edit, and a profile edit that keeps the session's role.
      - run: tsx --test lib/__tests__/admin-small-findings.test.ts

      # Optional: the same suites again on MilCityUSA's real published profile, when the BRAND_PROFILE_FIXTURE Actions
      # secret holds a published version's 434-context backup record. Secrets are not given to pull requests from
      # forks and are masked in logs. Without the secret this step says so and passes.
      - name: Tests on the real MilCityUSA profile (optional)
        env:
          BRAND_PROFILE_FIXTURE: ${{ secrets.BRAND_PROFILE_FIXTURE }}
        run: |
          if [ -z "$BRAND_PROFILE_FIXTURE" ]; then echo "No BRAND_PROFILE_FIXTURE secret: ran on the fixture profile only."; exit 0; fi
          printf '%s' "$BRAND_PROFILE_FIXTURE" > "$RUNNER_TEMP/brand-profile.json"
          BRAND_PROFILE_FILE="$RUNNER_TEMP/brand-profile.json" tsx --test lib/__tests__/content-pipeline.test.ts lib/__tests__/brand-profile.test.ts lib/__tests__/brand-profile-store.test.ts
