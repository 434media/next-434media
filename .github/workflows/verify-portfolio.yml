# Verifies the Work page still renders every published Section 4 record.
#
# Runs entirely on files in this repository — no secrets, no network, no access
# to the context store. That is the point: the context document cannot live in
# a public repo. The page is generated from it (lib/work-records.ts, written by
# docs/context/"04 Build"/master_extract.py in the context repo), so what CI can
# usefully check is not whether the
# records are correct — the generator settles that — but whether the page still
# shows all of them.
#
# scripts/check_drift.py deliberately does NOT run here. It compares the
# manifest against the master, and docs/context is a symlink to the shared
# drive that no clone has, so it exits zero without reaching the master. In CI
# it would be a check that always passes. It is a local tool.
name: Verify portfolio records

# Deliberately NOT path-filtered. This is a required status check, and a
# path-filtered workflow simply does not run on a PR that misses its paths — so
# GitHub never receives a result and the check hangs on "Expected" forever,
# blocking the merge. The job reads two files and needs no install beyond tsx,
# so running it on every PR costs seconds and always reports.
on:
  pull_request:
  push:
    branches: [main]

# The job only reads two files out of the checkout. Without an explicit block
# the GITHUB_TOKEN carries the repository default, which is wider than this
# needs — and a workflow that runs on every pull_request is exactly where a
# broad default token matters.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # The verifier reads two files and uses no runtime dependencies beyond
      # tsx, so a full install is unnecessary.
      - run: pnpm add -g tsx
      - run: tsx scripts/verify-work-page.ts
