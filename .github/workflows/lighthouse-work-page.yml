# Display and Design Standard 3.1, Enforcement. A Lighthouse check runs on every
# pull request that touches the Work page. What it actually enforces, as of
# Standard 1.12, is not one line:
#
#   desktop  LCP  error at 2,500 ms   the Core Web Vitals threshold, which
#                                     desktop meets
#   mobile   LCP  error at 4,000 ms   a regression ceiling set at the level the
#                                     page measures today - the worst CI median
#                                     on branch #129, 3,931 ms, rounded up to
#                                     the next 250. It may only be lowered,
#                                     never raised, and only by founder
#                                     approval. Owner: the founder.
#   mobile   LCP  warn  at 2,500 ms   the threshold itself, reported on every
#                                     run so the gap stays visible
#   both     CLS  error at 0.1        the threshold; both presets meet it
#   both     TBT  warn  at 200 ms     standing in for INP, which cannot be
#                                     measured in a lab run because its value
#                                     depends on which interactions are
#                                     performed. web.dev calls TBT "a reasonable
#                                     proxy metric for INP, but it's not a
#                                     substitute for INP in and of itself". It
#                                     warns rather than blocks because a shared
#                                     runner cannot measure a CPU-bound metric
#                                     reliably - measured here at 10 ms locally
#                                     against 525.5 ms in CI on one commit - and
#                                     it blocks again on dedicated hardware.
#
# So the check blocks on regression on mobile and on the threshold on desktop,
# and reports the threshold everywhere. The previous version of this comment
# said it "fails it where the page misses the Core Web Vitals thresholds", which
# has not been true of mobile since 1.12 or of TBT since 1.11.
#
# Five runs per preset, asserting on the median. The first run on a cold runner
# is routinely a wild outlier - 10,358 ms mobile and a 2,684 ms desktop LCP have
# both been observed - so the aggregation is load-bearing, not decoration.
#
# Two levels for one audit are expressed through assertMatrix, with two entries
# both matching ".*". Verified against real reports before use: both fire, and
# the error still sets exit 1.
#
# No secrets. This repository is public and so are its workflow logs, so results
# are written to the filesystem and uploaded as an artifact rather than sent to a
# Lighthouse CI server with a token.
name: Lighthouse — Work page

on:
  pull_request:
    paths:
      - "app/work/**"
      - "public/work/**"
      - "lib/work-records.ts"
      - "lib/work-stills-webp.ts"
      - "lib/sor/work-page-data.ts"
      - "components/Footer.tsx"
      - "components/combined-navbar.tsx"
      - "app/globals.css"
      - "app/layout.tsx"
      - "lighthouserc.*.json"
      - ".github/workflows/lighthouse-work-page.yml"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # lhci starts the server itself via startServerCommand, runs Lighthouse
      # three times, and asserts on the median of the three.
      - name: Lighthouse CI (${{ matrix.preset }})
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.${{ matrix.preset }}.json

      # include-hidden-files is required, not optional. upload-artifact v4:
      # "By default, hidden files are ignored by this action to avoid
      # unintentionally uploading sensitive information", where "Hidden files
      # are defined as any file beginning with `.` or files within folders
      # beginning with `.`". `.lighthouseci/` is such a folder, so every run so
      # far uploaded nothing and warned "No files were found with the provided
      # path" — including the runs that passed. There is nothing sensitive in a
      # Lighthouse report and this repository is public anyway.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.preset }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
